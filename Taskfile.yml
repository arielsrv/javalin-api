# yaml-language-server: $schema=https://json.schemastore.org/taskfile.json
version: '3'

vars:
  # app
  JAVA_VERSION: 25
  APP_NAME: javalin-api
  SRC_DIR: src
  BUILD_DIR: target
  DOCKER_IMAGE: '{{.APP_NAME}}:latest'
  HOST: 127.0.0.1
  PORT: 8081

  # deps
  # Ignora pre-releases (milestones/RC/alpha/beta) al buscar actualizaciones.
  VERSIONS_IGNORE: '.*-M\d+,.*-(rc|RC)\d+,.*-(alpha|beta).*'

  # kubernetes
  KUBERNETES_APP_NAMESPACE: default
  KUBERNETES_MANIFESTS_DIR: '{{.SRC_DIR}}/main/resources/kubernetes'
  KUBERNETES_APP_DEPLOYMENT_NAME: deployment.v1.apps/{{.APP_NAME}}--rolling-update
  KUBERNETES_OUTPUT_DIR: '{{.BUILD_DIR}}/kubernetes'
  KUBERNETES_INGRESS: '{{.APP_NAME}}.127.0.0.1.nip.io'
  KUBERNETES_CERT: '{{.BUILD_DIR}}/certs'

tasks:

  otel:update:
    desc: Download latest OpenTelemetry Java Agent
    vars:
      OTEL_AGENT_PATH: '{{.SRC_DIR}}/main/resources/opentelemetry-javaagent.jar'
      OTEL_RELEASES_URL: 'https://api.github.com/repos/open-telemetry/opentelemetry-java-instrumentation/releases/latest'
    cmds:
      - |
        echo "Fetching latest OpenTelemetry Java Agent version..."
        DOWNLOAD_URL=$(curl -s {{.OTEL_RELEASES_URL}} | grep -o 'https://github.com/open-telemetry/opentelemetry-java-instrumentation/releases/download/[^"]*opentelemetry-javaagent.jar' | head -1)
        VERSION=$(echo $DOWNLOAD_URL | grep -o 'v[0-9.]*')
        echo "Downloading OpenTelemetry Java Agent $VERSION..."
        curl -L -o {{.OTEL_AGENT_PATH}} "$DOWNLOAD_URL"
        echo "Downloaded to {{.OTEL_AGENT_PATH}}"

  deps:updates:
    desc: Show available dependency & plugin updates (skips pre-releases)
    silent: true
    cmds:
      - mvn versions:display-property-updates versions:display-dependency-updates versions:display-plugin-updates -Dmaven.version.ignore='{{.VERSIONS_IGNORE}}'

  deps:check:
    desc: Scan dependencies for known vulnerabilities (OWASP NVD). Set NVD_API_KEY to avoid rate limiting.
    silent: true
    cmds:
      - mvn org.owasp:dependency-check-maven:check -DnvdApiKey="${NVD_API_KEY}"

  build:
    silent: true
    cmds:
      - mvn clean package -DskipTests

  docker:debug:
    vars:
      DOCKERFILE: Dockerfile
    cmds:
      # --no-cache fuerza recompilar el código actual: sin esto, buildx reutiliza
      # la capa cacheada de `mvnw package` aunque src/ haya cambiado y termina
      # promoviendo a k8s una imagen con código viejo. Los `RUN --mount=type=cache`
      # del Dockerfile (repo .m2) NO se borran con --no-cache, así que las
      # dependencias siguen cacheadas y solo se recompila la fuente.
      - docker buildx build -t {{.DOCKER_IMAGE}} . -f {{.DOCKERFILE}} --build-arg=JAVA_VERSION={{.JAVA_VERSION}} --load

  docker:run:
    vars:
      ENV: localstack
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      OTEL_SERVICE_NAME: '{{.APP_NAME}}'
      OTEL_RESOURCE_ATTRIBUTES: 'service.name={{.APP_NAME}}'
      OTEL_TRACES_EXPORTER: otlp
      OTEL_METRICS_EXPORTER: prometheus
      OTEL_METRICS_EXEMPLAR_FILTER: always_off
      OTEL_EXPORTER_PROMETHEUS_HOST: '0.0.0.0'
      OTEL_EXPORTER_PROMETHEUS_PORT: 9464
      OTEL_LOGS_EXPORTER: none
      OTEL_EXPORTER_OTLP_ENDPOINT: 'http://alloy.monitoring:4317'
      OTEL_EXPORTER_OTLP_PROTOCOL: grpc
    cmds:
      - docker stop {{.APP_NAME}} || true && docker rm {{.APP_NAME}} || true
      - echo http://{{.HOST}}:{{.PORT}}/ping
      - |
        docker run -p {{.PORT}}:{{.PORT}} -p 9464:9464 --name {{.APP_NAME}} \
          -e APP_NAME={{.APP_NAME}} \
          -e ENV={{.ENV}} \
          -e AWS_ACCESS_KEY_ID={{.AWS_ACCESS_KEY_ID}} \
          -e AWS_SECRET_ACCESS_KEY={{.AWS_SECRET_ACCESS_KEY}} \
          -e OTEL_SERVICE_NAME={{.OTEL_SERVICE_NAME}} \
          -e OTEL_RESOURCE_ATTRIBUTES={{.OTEL_RESOURCE_ATTRIBUTES}} \
          -e OTEL_TRACES_EXPORTER={{.OTEL_TRACES_EXPORTER}} \
          -e OTEL_METRICS_EXPORTER={{.OTEL_METRICS_EXPORTER}} \
          -e OTEL_METRICS_EXEMPLAR_FILTER={{.OTEL_METRICS_EXEMPLAR_FILTER}} \
          -e OTEL_EXPORTER_PROMETHEUS_HOST={{.OTEL_EXPORTER_PROMETHEUS_HOST}} \
          -e OTEL_EXPORTER_PROMETHEUS_PORT={{.OTEL_EXPORTER_PROMETHEUS_PORT}} \
          -e OTEL_LOGS_EXPORTER={{.OTEL_LOGS_EXPORTER}} \
          -e OTEL_EXPORTER_OTLP_ENDPOINT={{.OTEL_EXPORTER_OTLP_ENDPOINT}} \
          -e OTEL_EXPORTER_OTLP_PROTOCOL={{.OTEL_EXPORTER_OTLP_PROTOCOL}} \
          {{.DOCKER_IMAGE}}

  docker:stop:
    silent: true
    cmds:
      - |
        docker stop {{.APP_NAME}} || true && docker rm {{.APP_NAME}} || true

  cert:mkdir:
    cmds:
      - mkdir -p {{.KUBERNETES_CERT}}

  cert:install:
    cmds:
      - (cd "{{.KUBERNETES_CERT}}" ||exit ; mkcert --install {{.KUBERNETES_INGRESS}})

  k:tls:
    cmds:
      - task: cert:mkdir
      - task: cert:install
      - |
        kubectl apply -f {{.KUBERNETES_MANIFESTS_DIR}}/base/namespace.yaml
        kubectl create secret tls {{.APP_NAME}}--secret \
          --cert {{.KUBERNETES_CERT}}/{{.KUBERNETES_INGRESS}}.pem \
          --key  {{.KUBERNETES_CERT}}/{{.KUBERNETES_INGRESS}}-key.pem \
          -n {{.KUBERNETES_APP_NAMESPACE}}

  k:run:
    desc: Run relevant kubernetes tasks.
    cmds:
      - task: docker:debug
      - task: k:build
      - task: k:apply
      - task: k:pod
      - task: k:ping
    preconditions:
      - kubectl get namespace {{.KUBERNETES_APP_NAMESPACE}}
      - kubectl get secret {{.APP_NAME}}--secret -n {{.KUBERNETES_APP_NAMESPACE}}

  k:mkdir:
    cmds:
      - mkdir -p {{.KUBERNETES_OUTPUT_DIR}}

  k:build:
    cmds:
      - task: k:mkdir
      - |
        kustomize build {{.KUBERNETES_MANIFESTS_DIR}}/base \
        --output {{.KUBERNETES_OUTPUT_DIR}}/release.yaml \
        --load-restrictor LoadRestrictionsNone

  k:apply:
    cmds:
      - kubectl apply -f {{.KUBERNETES_OUTPUT_DIR}}/release.yaml
      - kubectl rollout restart {{.KUBERNETES_APP_DEPLOYMENT_NAME}} -n {{.KUBERNETES_APP_NAMESPACE}}
      - kubectl rollout status {{.KUBERNETES_APP_DEPLOYMENT_NAME}} -n {{.KUBERNETES_APP_NAMESPACE}}

  k:pod:
    cmds:
      - kubectl get pods -n {{.KUBERNETES_APP_NAMESPACE}} -l app={{.APP_NAME}}

  k:ping:
    desc: k8s ingress ping
    cmds:
      # --retry 5: reintenta hasta 5 veces ante errores transitorios (curl trata
      # 502/503/504 como transitorios). Cubre la ventana del rolling update donde
      # Traefik todavía rutea al pod viejo que ya cerró el socket.
      # --retry-delay 1: 1s entre intentos. --retry-all-errors por si el fallo es
      # a nivel conexión (connection refused) y no un 5xx.
      - curl -i --retry 5 --retry-delay 1 --retry-all-errors -X GET 'https://{{.KUBERNETES_INGRESS}}/ping' ; echo
      - curl -i --retry 5 --retry-delay 1 --retry-all-errors -X GET 'https://{{.KUBERNETES_INGRESS}}/users' ; echo
