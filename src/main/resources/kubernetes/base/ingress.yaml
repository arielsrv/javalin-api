apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  annotations:
  labels:
    app: javalin-api
  name: ingress
spec:
  ingressClassName: traefik
  rules:
    - host: javalin-api.127.0.0.1.nip.io
      http:
        paths:
          - backend:
              service:
                name: javalin-api--service
                port:
                  name: http
            path: /
            pathType: Prefix
  tls:
    - hosts:
        - javalin-api.127.0.0.1.nip.io
      secretName: javalin-api--secret
